name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # needed for creating releases

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version from tag
        shell: pwsh
        run: |
          # e.g. GITHUB_REF_NAME = v1.2.3 -> VERSION = 1.2.3
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Version: $version"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # 10.x SDK

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Mapping_Tools

      - name: Publish x86
        run: dotnet publish Mapping_Tools -c Release -r win-x86 --no-restore --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true
      
      - name: Publish x64
        run: dotnet publish Mapping_Tools -c Release -r win-x64 --no-restore --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true

      - name: Zip x86 app
        shell: pwsh
        run: |
          $outDir = "Mapping_Tools/bin/Release/net10.0-windows/win-x86/publish"
          Compress-Archive -Path "$outDir/*" -DestinationPath "$outDir/release.zip" -Force
      
      - name: Zip x64 app
        shell: pwsh
        run: |
          $outDir = "Mapping_Tools/bin/Release/net10.0-windows/win-x64/publish"
          Compress-Archive -Path "$outDir/*" -DestinationPath "$outDir/release_x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release version ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            Mapping_Tools/bin/Release/net10.0-windows/win-x86/publish/release.zip
            Mapping_Tools/bin/Release/net10.0-windows/win-x64/publish/release_x64.zip
